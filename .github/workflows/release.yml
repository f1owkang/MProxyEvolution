name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub Release
    # 明确钉在 24.04：ubuntu-latest 会随镜像漂移（zip/git 等工具行为差异），
    # 发版流水线不宜跟着变；需要升级时显式改这一行。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules; full history for changelog)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ---------------------------------------------------------------------
      # 0. tag / 版本一致性
      #    版本号统一为三位 X.Y.Z（module.prop 不带 v 前缀），发布 tag 为 vX.Y.Z；
      #    scripts/build.sh 会用 tag 去掉 v 后的版本覆写 zip 内 module.prop 的
      #    version，所以必须以 tag 为准。产物命名与 KernelSU Modules 规范一致：
      #    MProxyEvolution-<versionCode>-<version>.zip。
      # ---------------------------------------------------------------------
      - name: Verify tag matches module/module.prop version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROP_VERSION="$(grep '^version=' module/module.prop | cut -d= -f2)"
          PROP_VERSION_STRIPPED="${PROP_VERSION#v}"
          VERSION_CODE="$(grep '^versionCode=' module/module.prop | cut -d= -f2)"
          if [ -z "$PROP_VERSION" ]; then
            echo "::error::module/module.prop is missing the version field"
            exit 1
          fi
          if ! printf '%s' "$VERSION_CODE" | grep -Eq '^[0-9]+$'; then
            echo "::error::module/module.prop versionCode is missing or not an integer: ${VERSION_CODE}"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PROP_VERSION_STRIPPED" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match module/module.prop version=${PROP_VERSION} (v prefix difference allowed)"
            exit 1
          fi
          echo "TAG_VERSION=${TAG_VERSION}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "ASSET_NAME=MProxyEvolution-${VERSION_CODE}-${TAG_VERSION}.zip" >> "$GITHUB_ENV"
          echo "Version check passed: tag=${GITHUB_REF_NAME} module.prop version=${PROP_VERSION} versionCode=${VERSION_CODE}"
          echo "Release asset: MProxyEvolution-${VERSION_CODE}-${TAG_VERSION}.zip"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            upstream/mihomo/go.sum

      # ---------------------------------------------------------------------
      # 1. 发布前校验：发布产物不可替换，回归必须在创建 release 之前挡住
      # ---------------------------------------------------------------------
      - name: Pre-release checks (sh -n / gofmt / go vet / go test)
        run: |
          set -euo pipefail
          for f in module/*.sh scripts/*.sh; do
            echo "sh -n $f"
            bash -n "$f"
          done
          unformatted="$(find backend -name '*.go' -not -path '*/webui/dist/*' -print0 | xargs -0 -r gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
          ( cd backend && go vet ./... && go test ./... -count=1 )

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: panel.lock

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ hashFiles('backend/go.sum', 'upstream/mihomo/go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-

      # ---------------------------------------------------------------------
      # 2. 构建 dist/MProxyEvolution-<versionCode>-<version>.zip + .sha256
      # ---------------------------------------------------------------------
      - name: Build module package
        run: bash scripts/build.sh --version "${TAG_VERSION}"

      - name: Verify build artifacts
        run: |
          set -euo pipefail
          ZIP="dist/${ASSET_NAME}"
          [ -f "$ZIP" ] || { echo "::error::${ZIP} was not generated"; exit 1; }
          ls -lh dist/
          cat "dist/${ASSET_NAME}.sha256"
          # 模块包必须能完整解压，且包含模块脚本 / THIRD_PARTY_NOTICES.txt / 正确版本
          unzip -t "$ZIP" > /dev/null
          unzip -l "$ZIP" | grep -q 'module.prop'
          unzip -l "$ZIP" | grep -q 'THIRD_PARTY_NOTICES.txt'
          unzip -p "$ZIP" module.prop | grep -qx "version=${TAG_VERSION}" \
            || { echo "::error::module.prop version inside the zip does not match the tag"; exit 1; }
          unzip -p "$ZIP" module.prop | grep -q '^updateJson=https://raw.githubusercontent.com/' \
            || { echo "::error::module.prop inside the zip is missing updateJson"; exit 1; }

      # ---------------------------------------------------------------------
      # 3. changelog.txt（同时作为 Release notes 与 update.json 的 changelog 资产）
      #
      #    基线来自 .release-baseline（上一版发布内容所在的 commit，发版后由最后
      #    一步回写）。不用 `git describe --tags`：tag 不一定都在 main 祖先链上，
      #    测试 tag 也会被误当作基线。兜底顺序：基线 → 上一个正式 v* tag → 全量。
      # ---------------------------------------------------------------------
      - name: Generate changelog.txt
        run: |
          set -euo pipefail
          BASE="$(tr -d '[:space:]' < .release-baseline 2>/dev/null || true)"
          : > changelog.txt

          if [ -n "$BASE" ] \
             && git cat-file -e "${BASE}^{commit}" 2>/dev/null \
             && git merge-base --is-ancestor "$BASE" "${GITHUB_REF_NAME}^{commit}"; then
            echo "Using .release-baseline=${BASE} as the changelog base"
            git log "${BASE}..${GITHUB_REF_NAME}" --pretty='- %s' > changelog.txt
          else
            echo "::warning::.release-baseline is missing or not an ancestor of ${GITHUB_REF_NAME}; falling back to the previous stable tag"
          fi

          if [ ! -s changelog.txt ]; then
            PREV_TAG="$(git tag --merged "${GITHUB_REF_NAME}^{commit}" --list 'v[0-9]*' \
              --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n1 || true)"
            if [ -n "$PREV_TAG" ]; then
              echo "Using previous stable tag ${PREV_TAG} as the changelog base"
              git log "${PREV_TAG}..${GITHUB_REF_NAME}" --pretty='- %s' > changelog.txt
            else
              echo "::warning::No previous stable tag available; using the full commit history"
              git log --pretty='- %s' > changelog.txt
            fi
          fi

          # 更新日志同时展示在 KernelSU 模块页/更新弹窗，保持 Markdown 可读
          {
            echo ""
            echo "### 安装包"
            echo ""
            echo "- \`${ASSET_NAME}\`：KernelSU / Magisk 模块包（含四架构后端与 mihomo 内核）"
            echo "- \`${ASSET_NAME}.sha256\`：SHA256 校验和"
            echo ""
            echo "安装与升级说明见 [README](https://github.com/${GITHUB_REPOSITORY}/blob/main/README.md)。"
            echo ""
            echo "> 仅支持 KernelSU / KernelSU Next / Magisk，Android 8.0+，arm64-v8a / armeabi-v7a / x86 / x86_64。"
          } >> changelog.txt
          echo "--- changelog.txt ---"
          cat changelog.txt

      # ---------------------------------------------------------------------
      # 4. KernelSU Modules 预检说明
      #
      #    资产命名已统一为 KernelSU Modules 的规范：
      #    {id}-{versionCode}-{version}.zip（MProxyEvolution-<versionCode>-<version>.zip），
      #    module.yaml 的 release.assetPattern 为 "MProxyEvolution-*.zip"，因此
      #    KernelSU-Modules/tools/actions/module-release 的 assetPattern 检查可以通过。
      #    但仍不接入该 action：四架构模块包约 131MB，超过其 100MB 上限
      #    （zip-too-large），需要先瘦身（例如只发 arm64 或拆分内核资产）。
      #    当前用上一步等价的本地 ZIP/module.prop 结构预检；瘦身后可直接替换为
      #    module-release action。
      # ---------------------------------------------------------------------

      # ---------------------------------------------------------------------
      # 5. 先建 draft 上传资产，再发布（release immutability 下资产只能在 draft
      #    阶段上传）
      # ---------------------------------------------------------------------
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: MihomoProxy Evolution ${{ github.ref_name }}
          body_path: changelog.txt
          draft: true
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/${{ env.ASSET_NAME }}
            dist/${{ env.ASSET_NAME }}.sha256
            changelog.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" --draft=false
          # KernelSU Modules 只接受 immutable release；未开启时只告警（资源已发布）。
          IMMUTABLE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .immutable)"
          if [ "$IMMUTABLE" != "true" ]; then
            echo "::warning::release ${GITHUB_REF_NAME} is not immutable; enable Enable release immutability under Settings -> General -> Releases before the next release"
          fi

      # ---------------------------------------------------------------------
      # 6. 回写 update.json 与 .release-baseline 到 main
      #    - update.json：version 为三位版本号（不带 v），zipUrl/changelog 的 URL
      #      用发布 tag（vX.Y.Z），资产名与带 versionCode 的 zip 一致，供
      #      KernelSU/Magisk 应用内更新；
      #    - .release-baseline：本次发布内容所在 commit（解析后的 SHA），作为
      #      下一版 changelog 的基线。
      # ---------------------------------------------------------------------
      - name: Write back update.json and .release-baseline
        run: |
          set -euo pipefail
          VERSION="$(grep '^version=' module/module.prop | cut -d= -f2)"
          VERSION="$(printf '%s' "$VERSION" | sed 's/^v//')"
          VERSION_CODE="$(grep '^versionCode=' module/module.prop | cut -d= -f2)"
          [ -n "$VERSION_CODE" ] || { echo "::error::module.prop is missing versionCode"; exit 1; }
          [ -n "$ASSET_NAME" ] || { echo "::error::ASSET_NAME is not set"; exit 1; }

          cat > update.json <<EOF
          {
            "version": "${VERSION}",
            "versionCode": ${VERSION_CODE},
            "zipUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ASSET_NAME}",
            "changelog": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/changelog.txt"
          }
          EOF

          # 存解析后的 commit SHA：annotated tag 的 GITHUB_SHA 可能是 tag 对象
          git rev-parse "${GITHUB_REF_NAME}^{commit}" > .release-baseline

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json .release-baseline
          if git diff --cached --quiet; then
            echo "update.json and .release-baseline are already up to date"
            exit 0
          fi
          git commit -m "chore(release): update update.json to ${GITHUB_REF_NAME} (with release baseline)"
          git push origin HEAD:main
          echo "Wrote update.json and .release-baseline back to main (version=${VERSION})"
