name: Feature request / 功能建议
description: 建议新的面板功能、代理/TUN 行为或安装/诊断体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 issue。功能需符合模块定位：mihomo 内核 + zashboard 面板的本地网络代理管理，不引入联网上传或遥测。
  - type: textarea
    id: need
    attributes:
      label: 使用场景与期望方案 / Use case & proposal
      description: 遇到什么问题、希望怎么解决；可附截图或参考做法
      placeholder: |
        场景：...
        期望：...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 补充（可选）/ Extra
      description: 现有替代做法、其他模块或上游（zashboard / mihomo）的做法、截图
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认 / Checklist
      options:
        - label: 已搜索现有 issue，确认不是重复建议
          required: true
        - label: 建议不涉及联网上传 / 遥测
          required: true
