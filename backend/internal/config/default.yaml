# MProxyEvolution 唯一配置文件（由 MProxyEvolution 后端生成，可手工编辑；面板中的设置会写回本文件）。
# 说明：x-mproxy 段是 MProxyEvolution 自有设置，mihomo 会忽略它。
#
# 分流说明（参考常见 Clash Verge / mihomo 桌面配置整理）：
#   - 规则使用远程规则集（rule-providers，MetaCubeX/meta-rules-dat 的 mrs 格式，经 jsDelivr 镜像，
#     由 mihomo 自己下载/缓存，后端不再代理下载），不再内联几千条域名。
#   - 首次启动（或规则集超过 interval）时内核会下载规则集；下载失败不会阻止内核启动，
#     只是对应规则暂时不生效，未命中的流量落到最后一条 MATCH；下载失败时沿用 mihomo 本地缓存。
#   - 关闭某类分流：删除或注释掉 rules 中对应的一行即可；要连下载一起停掉，再删除 rule-providers 里同名项。
#   - 导入订阅（面板「订阅导入」）会用订阅自带的 rules 整体替换本段规则，本段只作为默认直连时的基础分流。

x-mproxy:
  version: 1
  auto-start: true
  proxy-mode: tun          # tun | mixed（tproxy 预留，v0.1 拒绝）
  update-channel: stable   # stable | alpha
  ghproxy: ""              # 如 https://ghfast.top/，以 / 结尾
  onboarded: false
  private-dns: auto        # auto: TUN 运行时临时关闭系统 Private DNS；keep: 不修改
  ipv6: false              # 开启 IPv6 代理/DNS（默认关闭；需设备/运营商支持）

# 端口
mixed-port: 7890
socks-port: 7891
port: 0
allow-lan: false
bind-address: "*"
mode: rule
log-level: info
ipv6: false

# 控制器：后端通过它读取内核状态、热重载配置，并把 /api/mihomo/* 反向代理到这里
external-controller: 127.0.0.1:9090
secret: ""

# 性能与体验
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
geodata-mode: false

profile:
  store-selected: true
  store-fake-ip: true

# 域名嗅探：TUN 下从 TLS/HTTP/QUIC 握手还原域名，避免按 fake-ip 的 IP 分流
sniffer:
  enable: true
  parse-pure-ip: false
  force-dns-mapping: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# TUN：Android 上的透明代理入口（与 x-mproxy.proxy-mode 保持同步）
tun:
  enable: true
  stack: mixed
  auto-route: true
  # 参考 akashaProxy：原生 auto-route + auto-redirect，由 mihomo 自己接管
  # 路由/iptables；仅当原生 TUN 启动崩溃时才回退后端手工策略路由。
  auto-redirect: true
  auto-detect-interface: false
  dns-hijack:
    - any:53
    - tcp://any:53
  strict-route: true
  endpoint-independent-nat: true
  mtu: 1500

# DNS：fake-ip 模式，避免 DNS 泄漏与首包延迟
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  use-system-hosts: false
  # 这些域名不分配 fake-ip（需要真实 IP 的局域网 / NTP / 音乐 / 游戏 / 测速 / 流媒体校验域名）
  fake-ip-filter:
    - rule-set:私有网络   # 私有网络域名不分配 fake-ip（引用内置规则集，避免逐条维护）
    - "*.lan"
    - "*.localdomain"
    - "*.example"
    - "*.invalid"
    - "*.localhost"
    - "*.test"
    - "*.local"
    - "*.home.arpa"
    - time.*.com
    - time.*.gov
    - time.*.edu.cn
    - time.*.apple.com
    - time1.*.com
    - time2.*.com
    - time3.*.com
    - time4.*.com
    - time5.*.com
    - time6.*.com
    - time7.*.com
    - ntp.*.com
    - ntp1.*.com
    - ntp2.*.com
    - ntp3.*.com
    - ntp4.*.com
    - ntp5.*.com
    - ntp6.*.com
    - ntp7.*.com
    - "*.time.edu.cn"
    - "*.ntp.org.cn"
    - +.pool.ntp.org
    - time1.cloud.tencent.com
    - stun.*.*
    - stun.*.*.*
    - swscan.apple.com
    - mesu.apple.com
    - music.163.com
    - "*.music.163.com"
    - "*.126.net"
    - musicapi.taihe.com
    - music.taihe.com
    - songsearch.kugou.com
    - trackercdn.kugou.com
    - "*.kuwo.cn"
    - api-jooxtt.sanook.com
    - api.joox.com
    - y.qq.com
    - "*.y.qq.com"
    - streamoc.music.tc.qq.com
    - mobileoc.music.tc.qq.com
    - isure.stream.qqmusic.qq.com
    - dl.stream.qqmusic.qq.com
    - aqqmusic.tc.qq.com
    - amobile.music.tc.qq.com
    - localhost.ptlogin2.qq.com
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "*.xiami.com"
    - "*.music.migu.cn"
    - music.migu.cn
    - +.wotgame.cn
    - +.wggames.cn
    - +.wowsgame.cn
    - +.wargaming.net
    - "*.*.*.srv.nintendo.net"
    - "*.*.stun.playstation.net"
    - xbox.*.*.microsoft.com
    - "*.*.xboxlive.com"
    - "*.ipv6.microsoft.com"
    - teredo.*.*.*
    - teredo.*.*
    - speedtest.cros.wr.pvp.net
    - www.douyu.com
    - activityapi.huya.com
    - activityapi.huya.com.w.cdngslb.com
    - www.bilibili.com
    - api.bilibili.com
    - a.w.bilicdn1.com
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 国内 DNS（UDP + DoT + DoH 混合，避免单一协议被劫持/限速）
  nameserver:
    - 119.29.29.29
    - 223.5.5.5
    - tls://119.29.29.29
    - tls://223.5.5.5
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  # 解析代理节点域名用的 DNS：必须走真实上游，不能写 udp://127.0.0.1:1053（内核自己的 fake-ip 监听），
  # 否则节点域名会被分配 fake-ip，代理连不上；节点域名若已写进 fake-ip-filter 才可以用回环地址。
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  # 域名解析策略：内置规则集命中的域名走国内 DNS，广告域名直接返回空结果。
  nameserver-policy:
    "rule-set:私有网络,国内域名,苹果服务,哔哩哔哩": [119.29.29.29, 223.5.5.5]
    "rule-set:广告拦截": rcode://success

proxies: []

proxy-groups:
  # 唯一出口组：导入订阅后节点会追加到这里；未导入时只有 DIRECT，等价于「默认直连」
  - name: PROXY
    type: select
    proxies:
      - DIRECT

proxy-providers: {}

# 远程规则集（MetaCubeX/meta-rules-dat 的 mrs 格式，经 jsDelivr 镜像，由 mihomo 自己下载/缓存）
# 只保留和默认分流真正相关的类别，避免首次启动下载太多文件。
# - format: mrs 体积小、解析快（behavior 必须是 domain / ipcidr）。
# - proxy: PROXY 表示经当前出口下载：未导入订阅时 PROXY=DIRECT；导入订阅后走所选节点。
# - TLS 校验依赖后端启动内核前写入的 SSL_CERT_FILE / 内嵌 CA；下载失败不影响内核启动，
#   mihomo 会沿用 ./rules/ 下的本地缓存并在之后重试。
rule-providers:
  # 广告 / 跟踪 / 恶意域名 → REJECT（不需要拦截就注释掉 rules 里的 RULE-SET,广告拦截,REJECT）
  广告拦截:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ads-all.mrs
    path: ./rules/ads.mrs
    interval: 86400
    proxy: PROXY
  # 局域网 / 路由器管理域名（router.asus.com、Instant On 等）→ DIRECT
  私有网络:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs
    path: ./rules/private.mrs
    interval: 86400
    proxy: PROXY
  # 苹果服务（App Store / iCloud / iTunes / Apple Pay 等）→ DIRECT
  苹果服务:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/apple.mrs
    path: ./rules/apple.mrs
    interval: 86400
    proxy: PROXY
  # 哔哩哔哩 → DIRECT（港澳台番剧等需要代理时删掉 rules 里的对应行并改用订阅规则）
  哔哩哔哩:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/bilibili.mrs
    path: ./rules/bilibili.mrs
    interval: 86400
    proxy: PROXY
  # 国内常见域名（支付、国内 CDN、镜像站等）→ DIRECT
  国内域名:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/geolocation-cn.mrs
    path: ./rules/cn-domain.mrs
    interval: 86400
    proxy: PROXY
  # 国内 IP 段（运营商 / 国内机房）→ DIRECT，no-resolve 表示不为此规则触发 DNS 解析
  国内IP:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs
    path: ./rules/cn-ip.mrs
    interval: 86400
    proxy: PROXY

rules:
  # 1) 广告 / 跟踪：命中直接拒绝（mihomo 内置 REJECT，无需节点）
  - RULE-SET,广告拦截,REJECT
  # 2) 局域网 / 路由器管理域名：直连
  - RULE-SET,私有网络,DIRECT
  # 3) 本机与私有网段 IP：直连（兜住未被域名规则命中的局域网 IP）
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  # 4) 苹果服务：App Store / iCloud / iTunes / Apple Pay 直连（系统更新、推送更稳）
  - RULE-SET,苹果服务,DIRECT
  # 5) 哔哩哔哩：直连（国内 CDN 更快）
  - RULE-SET,哔哩哔哩,DIRECT
  # 6) 国内常见域名：直连
  - RULE-SET,国内域名,DIRECT
  # 7) 国内 IP 段：直连（仅匹配直连 IP，不触发 DNS 解析）
  - RULE-SET,国内IP,DIRECT,no-resolve
  # 8) 本机域名：直连
  - DOMAIN-SUFFIX,local,DIRECT
  # 10) 拒绝 QUIC/HTTP3：部分机场节点 TCP 正常但 UDP 转发不通，浏览器会卡在 QUIC
  #     且长时间不回退 TCP，表现为“海外网页一直转圈”。拒绝 UDP 443 可强制走 TCP。
  - AND,((NETWORK,udp),(DST-PORT,443)),REJECT
  # 11) 兜底：其余流量走 PROXY（未导入订阅时 PROXY=DIRECT，即默认直连）
  - MATCH,PROXY
