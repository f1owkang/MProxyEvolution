# MProxyEvolution 唯一配置文件（由 MProxyEvolution 后端生成，可手工编辑；面板中的设置会写回本文件）。
# 说明：x-mproxy 段是 MProxyEvolution 自有设置，mihomo 会忽略它。

x-mproxy:
  version: 1
  auto-start: true
  proxy-mode: tun          # tun | mixed（tproxy 预留，v0.1 拒绝）
  update-channel: stable   # stable | alpha
  ghproxy: ""              # 如 https://ghfast.top/，以 / 结尾
  onboarded: false
  private-dns: auto        # auto: TUN 运行时临时关闭系统 Private DNS；keep: 不修改
  ipv6: false              # 开启 IPv6 代理/DNS（默认关闭；需设备/运营商支持）

# 端口
mixed-port: 7890
socks-port: 7891
port: 0
allow-lan: false
bind-address: "*"
mode: rule
log-level: info
ipv6: false

# 控制器：后端通过它读取内核状态、热重载配置，并把 /api/mihomo/* 反向代理到这里
external-controller: 127.0.0.1:9090
secret: ""

# 性能与体验
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
geodata-mode: false

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# TUN：Android 上的透明代理入口（与 x-mproxy.proxy-mode 保持同步）
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  strict-route: false
  mtu: 1500

# DNS：fake-ip 模式，避免 DNS 泄漏与首包延迟
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.home.arpa"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "stun.*"
    - "time.*.com"
    - "time.*.apple.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  fallback-filter:
    geoip: false

proxies: []

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - DIRECT

proxy-providers: {}

rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - MATCH,PROXY
