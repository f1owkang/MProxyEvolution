# KernelSU Modules 展示元数据（仅展示用；version/versionCode 以 release ZIP 里的 module.prop 为准）
schemaVersion: 1
id: MProxyEvolution
name: MihomoProxy Evolution
summary: "mihomo 内核 + zashboard 面板的 KernelSU/Magisk 网络代理模块：全 WebUI 管理、TUN 透明代理、订阅导入、应用分流，只维护一份 config.yaml。 | A KernelSU/Magisk network proxy module powered by mihomo with the zashboard WebUI: TUN transparent proxy, subscription import and per-app routing, all managed from a single config.yaml."
description: README.md
license: GPL-3.0-only
homepage: https://github.com/f1owkang/MProxyEvolution
support: https://github.com/f1owkang/MProxyEvolution/issues
tags: [mihomo, proxy, tun, kernelsu, magisk, android, root]
icon: assets/icon.png

compatibility:
  # 模块包内同时提供 4 个 ABI 的 Go 后端与 mihomo 内核
  architectures: [arm64-v8a, armeabi-v7a, x86, x86_64]

authors:
  - name: f1owkang
    url: https://github.com/f1owkang

release:
  # 发布资产统一为 KernelSU Modules 规范：MProxyEvolution-<versionCode>-<version>.zip
  # （见 scripts/build.sh、release.yml 与 update.json）；
  # 用 glob 只圈模块包，避免 sha256 / changelog.txt 被当成模块 ZIP
  assetPattern: "MProxyEvolution-*.zip"
